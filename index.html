<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Anatomy Skeleton Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (Latin) + Noto Sans Arabic for clean, video-readable bilingual labels -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Render target -->
    <canvas id="scene"></canvas>

    <!-- Loading progress overlay -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__title">Loading skeleton</div>
        <div class="loader__bar">
          <div id="loader-fill" class="loader__fill"></div>
        </div>
        <div id="loader-pct" class="loader__pct">0%</div>
        <div id="loader-status" class="loader__status"></div>
      </div>
    </div>

    <!-- Bilingual label for the clicked bone (tracks the part in screen space) -->
    <div id="label" class="label">
      <div class="label__en"></div>
      <div class="label__ar" dir="rtl" lang="ar"></div>
    </div>

    <!-- Minimal UI (hideable for recording). -->
    <div id="ui" class="ui">
      <div class="ui__group">
        <div class="ui__label">Background</div>
        <div class="ui__row">
          <button class="btn is-active" data-bg="gradient">Dark</button>
          <button class="btn" data-bg="white">White</button>
          <button class="btn" data-bg="green">Green</button>
        </div>
      </div>
      <div class="ui__group">
        <div class="ui__label">View</div>
        <div class="ui__row">
          <button class="btn" data-view="anterior">Front</button>
          <button class="btn" data-view="sagittal">Side</button>
          <button class="btn" data-view="posterior">Back</button>
          <button class="btn" data-view="lumbar">Lumbar</button>
        </div>
      </div>
      <div class="ui__group">
        <div class="ui__label">Spine</div>
        <div class="ui__row">
          <button class="btn" id="region-toggle">Color-code regions</button>
          <button class="btn" id="isolate-toggle">Isolate</button>
        </div>
        <div id="spine-readout" class="ui__readout">Loading spine…</div>
      </div>
      <div class="ui__group">
        <div class="ui__label">Movement</div>
        <div class="ui__row ui__row--wrap">
          <button class="btn is-active" data-move="flexion">Flexion</button>
          <button class="btn" data-move="extension">Extension</button>
          <button class="btn" data-move="lateral">Lateral</button>
          <button class="btn" data-move="hinge">Hip hinge</button>
          <button class="btn" data-move="tilt">Pelvic tilt</button>
        </div>
        <div class="ui__row">
          <button class="btn btn--play" id="play-toggle">▶ Play</button>
          <button class="btn" id="anim-reset">Reset</button>
        </div>
        <div class="ui__slider">
          <label for="speed">Speed <span id="speed-val">1.0×</span></label>
          <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1" />
        </div>
      </div>
      <div class="ui__hint">Click a bone to label it · Press <kbd>H</kbd> to hide UI</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
